name: macOS - AnyDesk (Opsi 1)

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '355'

run-name: 'macOS AnyDesk ${{ github.run_id }}'

jobs:
  anydesk:
    name: AnyDesk on macos-latest
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Fail-fast: pastikan secret tersedia & valid. Nilai tidak pernah dicetak.
      - name: Validate AnyDesk Configuration
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          set -u
          if [ -z "${ANYDESK_PASSWORD:-}" ]; then
            echo "::error::Secret ANYDESK_PASSWORD belum dikonfigurasi (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${#ANYDESK_PASSWORD}" -lt 8 ]; then
            echo "::error::ANYDESK_PASSWORD harus minimal 8 karakter."
            exit 1
          fi
          echo "AnyDesk configuration valid."

      - name: Install AnyDesk
        run: |
          bash scripts/anydesk/install_anydesk.sh

      # Grant izin macOS TCC (layar, kontrol, dll) SEBELUM launch agar tidak
      # muncul dialog modal yang membuat `open`/AnyDesk menggantung.
      - name: Grant macOS Permissions (TCC)
        run: |
          bash scripts/anydesk/grant_tcc_permissions.sh

      - name: Launch & Configure AnyDesk
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
          ANYDESK_ALIAS: ${{ vars.ANYDESK_ALIAS }}
        run: |
          bash scripts/anydesk/configure_anydesk.sh

      - name: Print AnyDesk Access Info
        run: |
          bash scripts/anydesk/print_access_info.sh

      - name: Keep Alive
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh