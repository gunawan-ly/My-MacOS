name: macOS - Chrome Remote Desktop (V2)

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Nama host yang tampil di aplikasi Chrome Remote Desktop (default: mac-<run_id>).'
        required: false
        default: ''
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '355'
      otp:
        description: 'Security code OTP dari HP (Settings > Google > Manage Google Account > Security & sign-in > Security code). Diperlukan saat job memakai perangkat/login baru; jika kosong memakai secret CRD_OTP.'
        required: false
        default: ''
      session_mode:
        description: "'restore' = pakai cache sesi terbaru (default). 'fresh' = ABAIKAN cache, paksa login+OTP sekali lalu simpan cookie baru (untuk mereset sesi yang dianggap usang)."
        required: false
        default: 'restore'
        type: choice
        options:
          - restore
          - fresh
      cache_key:
        description: 'Opsional. Pin key cache SPESIFIK untuk direstore (contoh: crd-session-me@mail.com-35185623180). Biarkan kosong utk memakai cache terbaru.'
        required: false
        default: ''

run-name: 'CRD V2 (${{ github.run_id }})'

defaults:
  run:
    shell: bash

jobs:
  crd:
    name: Chrome Remote Desktop (V2 - verifikasi penuh)
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
      GOOGLE_PASS: ${{ secrets.GOOGLE_PASS }}
      CRD_PIN: ${{ secrets.CRD_PIN }}
      CRD_OTP: ${{ inputs.otp || secrets.CRD_OTP }}
      CRD_SUDO_PASS: ${{ secrets.CRD_SUDO_PASS }}
      CRD_LOCAL_PASS: ${{ secrets.CRD_LOCAL_PASS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        run: |
          set -u

          if [ -z "${GOOGLE_USER:-}" ]; then
            echo "::error::Secret GOOGLE_USER kosong. Set email akun Google pemilik CRD."
            exit 1
          fi
          case "$GOOGLE_USER" in
            *@*) ;;
            *)
              echo "::error::GOOGLE_USER harus berupa email."
              exit 1
              ;;
          esac

          if [ -z "${GOOGLE_PASS:-}" ]; then
            echo "::error::Secret GOOGLE_PASS belum dikonfigurasi."
            exit 1
          fi

          if [ -z "${CRD_PIN:-}" ]; then
            echo "::error::Secret CRD_PIN belum dikonfigurasi."
            exit 1
          fi
          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            echo "::error::CRD_PIN harus angka 6+ digit (contoh: 123456)."
            exit 1
          fi

          if [ -n "${CRD_OTP:-}" ]; then
            echo "OTP disuplai dari ${{ inputs.otp && 'input otp' || 'secret CRD_OTP' }}."
          else
            echo "::warning::CRD_OTP kosong. Jika job memakai perangkat/login baru, Google akan meminta"
            echo "::warning::security code di HP (Settings > Google > Manage Google Account > Security"
            echo "::warning::& sign-in > Security code) dan enrollment akan GAGAL cepat tanpa mengisinya."
          fi

          echo "Configuration valid."

      - name: Provision user pembantu admin (utk prompt installer GUI)
        if: env.CRD_HELPER_USER != '' && env.CRD_HELPER_PASS != ''
        env:
          CRD_HELPER_USER: ${{ secrets.CRD_HELPER_USER }}
          CRD_HELPER_PASS: ${{ secrets.CRD_HELPER_PASS }}
        run: |
          set -uo pipefail
          u="${CRD_HELPER_USER}"
          p="${CRD_HELPER_PASS}"
          if ! sudo -n true 2>/dev/null; then
            echo "::warning::NOPASSWD tidak aktif — tidak bisa buat user pembantu; lewati."
            exit 0
          fi
          if sudo -n dscl . -list /Users 2>/dev/null | grep -qx "$u"; then
            # User sudah ada: reset (mungkin gagal tanpa SecureToken -> non-fatal).
            if sudo -n sysadminctl -resetPasswordFor "$u" -newPassword "$p" 2>&1; then
              echo "Password user pembantu $u di-reset (dikenal)."
            else
              echo "::warning::reset password $u gagal — gunakan CRD_HELPER_USER baru jika perlu."
            fi
          else
            if sudo -n sysadminctl -addUser "$u" -fullName "CRD Helper Admin" \
                 -password "$p" -home "/Users/$u" -admin 2>&1; then
              echo "User pembantu $u DIBUAT (admin, password dikenal)."
            else
              echo "::warning::sysadminctl gagal buat user $u (non-fatal)."
            fi
          fi
          if sudo -n dscl . -authonly "$u" "$p" 2>/dev/null; then
            echo "AUTH OK: user=$u password=(ter-mask otomatis oleh GitHub)"
            printf 'user=%s\npassword=%s\n' "$u" "$p" > /tmp/crd-helper.creds
          else
            echo "::warning::verifikasi auth user $u GAGAL (non-fatal)."
          fi

      - name: Restore Cache Sesi CRD (cookie Google)
        if: ${{ inputs.session_mode != 'fresh' }}
        id: crd-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/crd-session-cookies.json
          key: ${{ inputs.cache_key || format('crd-session-{0}-{1}', secrets.GOOGLE_USER, github.run_id) }}
          restore-keys: |
            crd-session-${{ secrets.GOOGLE_USER }}-
            crd-session-
          enableCrossOsArchive: true

      - name: Cek ketersediaan cache sesi
        run: |
          if [ "${{ inputs.session_mode }}" = "fresh" ]; then
            echo "Mode: fresh — cache DIABAIKAN, login+OTP paksa, cookie baru akan disimpan."
            rm -f /tmp/crd-session-cookies.json /tmp/crd-session-fresh
          else
            echo "Mode: ${{ inputs.cache_key && format('manual cache_key={0}', inputs.cache_key) || 'restore (cache terbaru)' }}"
          fi
          if [ -f /tmp/crd-session-cookies.json ]; then
          python3 - <<'PY'
          import json, os
          p = "/tmp/crd-session-cookies.json"
          try:
              d = json.load(open(p))
              c = d.get("cookies") or []
              print("Cache sesi ada: akun=%s cookie=%d ukuran=%.1f KB" % (
                  d.get("account", "?"), len(c), os.path.getsize(p) / 1024.0))
              dm = d.get("domains")
              if dm:
                  print("  domain: %s" % ", ".join(dm))
              if d.get("schema_version") != 2:
                  print("  PERINGATAN: schema_cache=%s (akan ditolak oleh enroll)" % d.get("schema_version"))
          except Exception as e:
              print("Cache sesi ada tapi tidak terbaca: %s" % e)
          PY
          else
            echo "::warning::Cache sesi kosong (belum ada / kedaluwarsa)."
            echo "::warning::Jika Google meminta verifikasi, isi input 'otp' saat"
            echo "::warning::workflow_dispatch dgn security code dari HP."
          fi

      - name: Setup Chrome Remote Desktop (V2)
        env:
          CRD_NAME: ${{ inputs.hostname }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
          CRD_OTP: ${{ inputs.otp || secrets.CRD_OTP }}
          CRD_SESSION_FILE: /tmp/crd-session-cookies.json
          CRD_CLEANUP: "0"
        run: |
          bash scripts/crd/setup_crd_v2.sh

      - name: Flag sesi segar (login OK di run ini)
        id: crd-fresh
        run: |
          if [ -f /tmp/crd-session-fresh ]; then
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Save cache sesi (SELALU jalan walau run error sesudahnya)
        if: ${{ always() && steps.crd-fresh.outputs.fresh == '1' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/crd-session-cookies.json
          key: crd-session-${{ secrets.GOOGLE_USER }}-${{ github.run_id }}
          enableCrossOsArchive: true

      - name: Upload Debug Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crd-debug-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/crd-*.png
            /tmp/crd-*.log
            /tmp/crd.enroll.err.log
            /tmp/crd.code
            /tmp/crd.dmg
            /tmp/crd.start.log
            /tmp/crd-helper.creds

      - name: Keep Alive
        if: ${{ success() }}
        env:
          CRD_NAME: ${{ inputs.hostname }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh