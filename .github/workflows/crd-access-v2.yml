name: macOS - Chrome Remote Desktop (V2)

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Nama host yang tampil di aplikasi Chrome Remote Desktop (default: mac-<run_id>).'
        required: false
        default: ''
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '355'
      otp:
        description: 'Security code OTP dari HP (Settings > Google > Manage Google Account > Security & sign-in > Security code). Diperlukan saat job memakai perangkat/login baru; jika kosong memakai secret CRD_OTP.'
        required: false
        default: ''

run-name: 'CRD V2 (${{ github.run_id }})'

defaults:
  run:
    shell: bash

jobs:
  crd:
    name: Chrome Remote Desktop (V2 - verifikasi penuh)
    runs-on: macos-latest
    timeout-minutes: 360
    permissions:
      issues: write
      contents: read

    env:
      GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
      GOOGLE_PASS: ${{ secrets.GOOGLE_PASS }}
      CRD_PIN: ${{ secrets.CRD_PIN }}
      CRD_OTP: ${{ inputs.otp || secrets.CRD_OTP }}
      CRD_SUDO_PASS: ${{ secrets.CRD_SUDO_PASS }}
      CRD_LOCAL_PASS: ${{ secrets.CRD_LOCAL_PASS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        run: |
          set -u

          if [ -z "${GOOGLE_USER:-}" ]; then
            echo "::error::Secret GOOGLE_USER kosong. Set email akun Google pemilik CRD."
            exit 1
          fi
          case "$GOOGLE_USER" in
            *@*) ;;
            *)
              echo "::error::GOOGLE_USER harus berupa email."
              exit 1
              ;;
          esac

          if [ -z "${GOOGLE_PASS:-}" ]; then
            echo "::error::Secret GOOGLE_PASS belum dikonfigurasi."
            exit 1
          fi

          if [ -z "${CRD_PIN:-}" ]; then
            echo "::error::Secret CRD_PIN belum dikonfigurasi."
            exit 1
          fi
          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            echo "::error::CRD_PIN harus angka 6+ digit (contoh: 123456)."
            exit 1
          fi

          if [ -n "${CRD_OTP:-}" ]; then
            echo "OTP disuplai dari ${{ inputs.otp && 'input otp' || 'secret CRD_OTP' }}."
          else
            echo "::warning::CRD_OTP kosong. Jika job memakai perangkat/login baru, Google akan meminta"
            echo "::warning::security code di HP (Settings > Google > Manage Google Account > Security"
            echo "::warning::& sign-in > Security code) dan enrollment akan GAGAL cepat tanpa mengisinya."
          fi

          echo "Configuration valid."

      - name: Set password user job (agar sudo -S tersedia)
        if: env.CRD_LOCAL_PASS != ''
        env:
          CRD_LOCAL_PASS: ${{ secrets.CRD_LOCAL_PASS }}
        run: |
          if sudo -n true 2>/dev/null && [ -n "$CRD_LOCAL_PASS" ]; then
            if sudo -n dscl . -passwd /Users/"$(whoami)" "$CRD_LOCAL_PASS" 2>/dev/null; then
              echo "Password job user $(whoami) ditetapkan (dikenal)."
            else
              echo "::warning::dscl gagal set password (abaikan bila sudo NOPASSWD sudah aktif)."
              echo "::warning::Pastikan secret CRD_SUDO_PASS utk fallback run_sudo."
            fi
          else
            echo "::warning::Tanpa NOPASSWD, dscl tidak bisa set password."
            echo "::warning::Pastikan secret CRD_SUDO_PASS utk fallback run_sudo."
          fi

      - name: Restore Cache Sesi CRD (cookie Google)
        id: crd-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/crd-session-cookies.json
          key: crd-session-${{ secrets.GOOGLE_USER }}-${{ github.run_id }}
          restore-keys: |
            crd-session-${{ secrets.GOOGLE_USER }}-
            crd-session-
          enableCrossOsArchive: true

      - name: Cek ketersediaan cache sesi
        run: |
          if [ -f /tmp/crd-session-cookies.json ]; then
            echo "Cache sesi ada — login diharapkan tanpa OTP."
          else
            echo "::warning::Cache sesi kosong (belum ada / kedaluwarsa)."
            echo "::warning::Jika Google meminta verifikasi, isi input 'otp' saat"
            echo "::warning::workflow_dispatch dgn security code dari HP."
          fi

      # DINONAKTIFKAN sementara: fokus ke login browser + CAPTCHA via issue.
      # Aktifkan lagi bila jalur cookie mau dipakai.
      - name: Tulis cookie sesi dari secret (login via HP)
        if: false
        env:
          CRD_SESSION_COOKIES: ${{ secrets.CRD_SESSION_COOKIES }}
        run: |
          # Secret berisi JSON cookie (format Cookie-Editor atau CDP).
          # Dikonversi ke format session file enroll.py lalu ditulis ke
          # /tmp/crd-session-cookies.json agar try_restore_session() memakainya.
          python3 scripts/crd/convert_cookies.py

      - name: "Konek Tailscale (exit node via HP Awan)"
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          # Konek ke tailnet dengan exit node HP Awan (100.66.25.126)
          # --accept-routes: terima routes dari tailnet
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="gh-crd-runner" --exit-node=100.66.25.126 --accept-routes || {
            echo "::warning::Tailscale gagal konek, lanjut tanpa VPN (fallback ke CAPTCHA via issue)"
          }
          # Verifikasi koneksi
          tailscale status || echo "::warning::tailscale status gagal"
          # Cek IP publik (harusnya IP seluler Awan kalau exit node aktif)
          curl -s -m 10 https://ifconfig.me || echo "cek IP gagal"

      - name: "Setup CRD (Install + Login + Registrasi)"
        env:
          CRD_NAME: ${{ inputs.hostname }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
          CRD_OTP: ${{ inputs.otp || secrets.CRD_OTP }}
          CRD_SESSION_FILE: /tmp/crd-session-cookies.json
          CRD_CLEANUP: "0"
          CRD_SKIP_SESSION_RESTORE: "1"
        run: |
          # Install deps untuk upload artifact langsung dari enroll.py
          if [ -f scripts/crd/package.json ]; then
            (cd scripts/crd && npm install --no-audit --no-fund --silent) || echo "::warning::npm install gagal, upload langsung dinonaktifkan"
          fi
          # Jalankan semua tahap sekaligus (tanpa split phase1/phase2)
          bash scripts/crd/setup_crd_v2.sh all

      - name: "Disconnect Tailscale (hemat kuota HP)"
        if: ${{ always() }}
        run: |
          sudo tailscale logout || true
          echo "Tailscale disconnected. Awan bisa matiin exit node di HP."

      - name: Upload Screenshot Login
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crd-login-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/crd-*.png

      - name: Flag sesi segar (login OK di run ini)
        id: crd-fresh
        run: |
          if [ -f /tmp/crd-session-fresh ]; then
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Save cache sesi (SELALU jalan walau run error sesudahnya)
        if: ${{ always() && steps.crd-fresh.outputs.fresh == '1' }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/crd-session-cookies.json
          key: crd-session-${{ secrets.GOOGLE_USER }}-${{ github.run_id }}
          enableCrossOsArchive: true

      - name: Keep Alive
        if: ${{ success() }}
        env:
          CRD_NAME: ${{ inputs.hostname }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh