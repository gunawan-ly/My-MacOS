name: macOS Remote (HP-ready)

# Akses termudah dari HP: 1 password untuk SSH (user vncuser) + VNC via Tailscale.
# Adaptasi dari dikeckaan/MacOS-Workflow-VNC (fastmac-gui): user baru vncuser
# adalah jalan pintas tembok SecureToken akun runner. (ngrok/tmate dicoba dan
# dibuang: ngrok TCP butuh verifikasi kartu, DNS *.tmate.io diblokir di pool ini.)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password untuk user vncuser (SSH) + VNC. Kosongkan = pakai secret VNC_PASSWORD.'
        required: false
        default: ''
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '355'

run-name: 'Remote (${{ github.run_id }})'

defaults:
  run:
    shell: bash

jobs:
  remote:
    name: Remote HP-ready on macos-latest
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          INPUT_PASSWORD: ${{ inputs.password }}
        run: |
          set -u
          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "::error::Secret TAILSCALE_AUTHKEY belum dikonfigurasi."
            exit 1
          fi
          if [ -n "${INPUT_PASSWORD:-}" ]; then
            echo "Password: dari input workflow."
          elif [ -n "${VNC_PASSWORD:-}" ]; then
            echo "Password: dari secret VNC_PASSWORD."
          else
            echo "::error::Isi input password ATAU secret VNC_PASSWORD."
            exit 1
          fi
          echo "Configuration valid."

      - name: Setup User + VNC + Tailscale
        env:
          VNC_PASS: ${{ inputs.password != '' && inputs.password || secrets.VNC_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/remote/setup_remote.sh

      - name: Keep Alive
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh
