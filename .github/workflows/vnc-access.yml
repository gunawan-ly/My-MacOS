name: macOS - VNC via Tailscale

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: 'Durasi keep-alive dalam menit (maks 355).'
        required: false
        default: '355'

run-name: 'VNC (${{ github.run_id }})'

defaults:
  run:
    shell: bash

jobs:
  vnc:
    name: VNC (Screen Sharing) on macos-latest
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -u
          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "::error::Secret TAILSCALE_AUTHKEY belum dikonfigurasi."
            exit 1
          fi
          if [ -z "$VNC_PASSWORD" ]; then
            echo "::error::Secret VNC_PASSWORD belum dikonfigurasi."
            exit 1
          fi
          if [ "${#VNC_PASSWORD}" -lt 8 ]; then
            echo "::error::VNC_PASSWORD minimal 8 karakter."
            exit 1
          fi
          echo "Configuration valid."

      - name: Setup Tailscale (untuk akses dari perangkat kamu)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          MAC_USER_PASSWORD: ${{ secrets.MAC_USER_PASSWORD }}
          TS_HOSTNAME: mac-${{ github.run_id }}
        run: |
          bash scripts/ssh/tailscale_ssh.sh

      - name: Setup VNC (Screen Sharing)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/vnc/setup_vnc.sh

      - name: Keep Alive
        env:
          KEEP_ALIVE_MINUTES: ${{ inputs.keep_alive_minutes }}
        run: |
          bash scripts/keep_alive.sh